version: '3.7'
services:
  #PHP8
  php8:
    image: php:8.0-fpm
    container_name: php8
    restart: always
    env_file:
      - prod.env
    volumes:
      - ./:/var/www/html
    networks:
      - geminadas
    depends_on:
      - mysql
    environment:
      - MYSQL_HOST=mysql.geminadas.com
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_PORT=3306
  
  #NGINX
  nginx:
    image: nginx:1.21.0
    container_name: nginx
    restart: always
    volumes:
      - "./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - "./etc/ssl:/etc/ssl"
      - "./web:/var/www/html"
      - "./etc/nginx/default.template.conf:/etc/nginx/conf.d/default.template"
    networks:
      - geminadas
    ports:
      - 80:80
      - 443:443
    depends_on:
      - php8
networks:
  geminadas: {}
